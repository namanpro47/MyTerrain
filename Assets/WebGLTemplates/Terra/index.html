<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09131a"><title>MyTerrain</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09131a;color:#edf5ee;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#09131a}h1{font-weight:500;letter-spacing:-.04em;font-size:38px;margin:0 0 24px}p{color:#a7beba;font-size:14px}progress{width:240px;height:3px;accent-color:#99deba}button{padding:12px 24px;border:0;border-radius:8px;background:#99deba;color:#09131a;font:inherit}noscript{position:fixed;inset:40%;width:300px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}</style></head>
<body><canvas id="unity-canvas" tabindex="0" aria-label="MyTerrain. Drag the globe to rotate. Use 1, 2 or 3 to choose a location, then Enter to descend. Shift Escape returns to the globe." aria-describedby="instructions"></canvas>
<p id="instructions" class="sr-only">All map selection and gameplay run inside Unity. Arrow keys rotate the globe; plus and minus zoom. In the landscape, B opens projects, Tab cycles sites, Enter queues a proposal and E reviews the year. Question mark opens controls and accessibility settings.</p>
<div id="loading" role="status"><h1>MyTerrain</h1><progress id="progress" max="1" value="0"></progress><p id="status">Opening your world…</p><button id="retry" hidden onclick="location.reload()">Try again</button></div>
<noscript>MyTerrain needs JavaScript to run. Please enable it and reload.</noscript>
<script>window.TERRA_BUILD={loader:'Build/{{{ LOADER_FILENAME }}}',data:'Build/{{{ DATA_FILENAME }}}',framework:'Build/{{{ FRAMEWORK_FILENAME }}}',code:'Build/{{{ CODE_FILENAME }}}'};</script><script src="player.js"></script></body></html>
